# Checks config/downstreams.yaml on every pull request that changes it. Entries
# come from outside developers, often from forks, so this needs no secrets.
name: downstreams

on:
  pull_request:
    paths:
      - config/downstreams.yaml
      - downstream/**
      - go.mod
      - go.sum
      - .github/workflows/downstreams.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./downstream/
