# Images live in asia-northeast1, not asia-east1 and not gcr.io.
#
# Both `asia.gcr.io` and the asia-east1 Artifact Registry location stopped
# accepting writes (503) and blob reads (500) for this project in August 2026,
# after the project was deleted and restored. Metadata still reads fine, so a
# tag listing looks healthy while nothing can actually be pushed or pulled.
# asia-northeast1 is unaffected. See outdoorsafetylab/outdoorsafetylab#47.
#
# The Cloud Run services stay in asia-east1 ($_REGION); only the registry
# moved, so they pull cross-region. `gcr.io/cloud-builders/*` below is Google's
# own public builder image and is unrelated to the broken repositories.
#
steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--build-arg'
  - 'GIT_HASH=$SHORT_SHA'
  - '--build-arg'
  - 'GIT_TAG=$TAG_NAME'
  - '-t'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer'
  - '-f'
  - 'Dockerfile'
  - '.'
- name: 'gcr.io/cloud-builders/docker'
  args: 
  - push
  - asia-northeast1-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - run
  - deploy
  - $_SERVICE_NAME
  - --image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer
  - --region=$_REGION
  - --platform=managed
# The mirror health check runs as a Cloud Run job from this same image, started
# by Cloud Scheduler: GitHub's scheduled workflows fire hours late, and a
# mirror that goes down or falls behind has to be noticed within minutes.
# Only the trigger that sets _HEALTHCHECK_JOB updates it, so the job always
# runs the code production serves. The job itself (service account, secrets,
# `healthcheck -c docker` in place of the image's `serve` entrypoint) is
# created once outside this file; `update` keeps all of that and swaps only
# the image.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: bash
  args:
  - -c
  - |
    if [ -n "$_HEALTHCHECK_JOB" ]; then
      gcloud run jobs update "$_HEALTHCHECK_JOB" \
        --image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer \
        --region=$_REGION
    fi
substitutions:
  _HEALTHCHECK_JOB: ''
