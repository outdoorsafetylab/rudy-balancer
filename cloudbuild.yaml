# The registry's region is _AR_REGION. In the outdoorsafetylab project it is
# asia-northeast1: both `asia.gcr.io` and that project's asia-east1 Artifact
# Registry location stopped accepting writes (503) and blob reads (500) in
# August 2026, after the project was deleted and restored. See
# outdoorsafetylab/outdoorsafetylab#47. The rudymap project's triggers set
# asia-east1, next to the services (#32). `gcr.io/cloud-builders/*` below is
# Google's own public builder image and is unrelated to either registry.
#
# The rudymap triggers run as their own service account (_SERVICE_ACCOUNT is
# the services' runtime account), which is why logs go to Cloud Logging only.
#
steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--build-arg'
  - 'GIT_HASH=$SHORT_SHA'
  - '--build-arg'
  - 'GIT_TAG=$TAG_NAME'
  - '-t'
  - '${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer'
  - '-f'
  - 'Dockerfile'
  - '.'
- name: 'gcr.io/cloud-builders/docker'
  args: 
  - push
  - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer
# Only the image changes here; everything else about a service is kept from
# its current revision. A trigger that sets _SERVICE_ACCOUNT also names the
# runtime account, so the first deploy of a new service does not run as the
# project's default compute account.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: bash
  args:
  - -c
  - |
    set -euo pipefail
    extra=""
    if [ -n "$_SERVICE_ACCOUNT" ]; then
      extra="--service-account=$_SERVICE_ACCOUNT"
    fi
    gcloud run deploy $_SERVICE_NAME \
      --image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer \
      --region=$_REGION --platform=managed $$extra
# The mirror health check runs as a Cloud Run job from this same image,
# started by Cloud Scheduler: GitHub's scheduled workflows fire hours late,
# and a mirror that goes down or falls behind has to be noticed sooner. Only
# the trigger that sets _HEALTHCHECK_JOB updates it. The job is declared in
# deploy/terraform/healthcheck.tf, which leaves its image to this step.
#
# The image is pinned to the digest the service just deployed, not to the
# tag: every build, the alpha one on master included, pushes the same untagged
# image, so the tag can point at code production does not serve.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: bash
  args:
  - -c
  - |
    set -euo pipefail
    if [ -z "$_HEALTHCHECK_JOB" ]; then
      exit 0
    fi
    revision="$$(gcloud run services describe $_SERVICE_NAME --region=$_REGION --format='value(status.latestReadyRevisionName)')"
    image="$$(gcloud run revisions describe "$$revision" --region=$_REGION --format='value(status.imageDigest)')"
    echo "Updating job $_HEALTHCHECK_JOB to $$image ($$revision)"
    gcloud run jobs update "$_HEALTHCHECK_JOB" --image="$$image" --region=$_REGION
substitutions:
  _HEALTHCHECK_JOB: ''
  _AR_REGION: asia-northeast1
  _SERVICE_ACCOUNT: ''
options:
  logging: CLOUD_LOGGING_ONLY
