# Images live in asia-northeast1, not asia-east1 and not gcr.io.
#
# Both `asia.gcr.io` and the asia-east1 Artifact Registry location stopped
# accepting writes (503) and blob reads (500) for this project in August 2026,
# after the project was deleted and restored. Metadata still reads fine, so a
# tag listing looks healthy while nothing can actually be pushed or pulled.
# asia-northeast1 is unaffected. See outdoorsafetylab/outdoorsafetylab#47.
#
# The Cloud Run services stay in asia-east1 ($_REGION); only the registry
# moved, so they pull cross-region. `gcr.io/cloud-builders/*` below is Google's
# own public builder image and is unrelated to the broken repositories.
#
steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--build-arg'
  - 'GIT_HASH=$SHORT_SHA'
  - '--build-arg'
  - 'GIT_TAG=$TAG_NAME'
  - '-t'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer'
  - '-f'
  - 'Dockerfile'
  - '.'
- name: 'gcr.io/cloud-builders/docker'
  args: 
  - push
  - asia-northeast1-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - run
  - deploy
  - $_SERVICE_NAME
  - --image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/rudy-balancer/rudy-balancer
  - --region=$_REGION
  - --platform=managed
# The mirror health check runs as a Cloud Run job from this same image,
# started by Cloud Scheduler: GitHub's scheduled workflows fire hours late,
# and a mirror that goes down or falls behind has to be noticed sooner. Only
# the trigger that sets _HEALTHCHECK_JOB updates it. The job is declared in
# deploy/terraform/healthcheck.tf, which leaves its image to this step.
#
# The image is pinned to the digest the service just deployed, not to the
# tag: every build, the alpha one on master included, pushes the same untagged
# image, so the tag can point at code production does not serve.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: bash
  args:
  - -c
  - |
    set -euo pipefail
    if [ -z "$_HEALTHCHECK_JOB" ]; then
      exit 0
    fi
    revision="$$(gcloud run services describe $_SERVICE_NAME --region=$_REGION --format='value(status.latestReadyRevisionName)')"
    image="$$(gcloud run revisions describe "$$revision" --region=$_REGION --format='value(status.imageDigest)')"
    echo "Updating job $_HEALTHCHECK_JOB to $$image ($$revision)"
    gcloud run jobs update "$_HEALTHCHECK_JOB" --image="$$image" --region=$_REGION
substitutions:
  _HEALTHCHECK_JOB: ''
